name: edupilot
services:
  edupilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: edupilot:local
    container_name: edupilot
    restart: unless-stopped
    init: true
    environment:
      DATABASE_PATH: /data/edupilot.db
      UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: https://edupilot.ci
      SECRET_KEY: ${SECRET_KEY:?Configurez SECRET_KEY dans le fichier .env}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-EduPilot}
      TZ: Africa/Abidjan
    volumes:
      - ./data:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.edupilot.rule=Host(`edupilot.ci`) || Host(`www.edupilot.ci`)"
      - "traefik.http.routers.edupilot.entrypoints=websecure"
      - "traefik.http.routers.edupilot.tls=true"
      - "traefik.http.routers.edupilot.tls.certresolver=letsencrypt"
      - "traefik.http.services.edupilot.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.edupilot-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.edupilot-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.edupilot-headers.headers.browserXssFilter=true"
      - "traefik.http.routers.edupilot.middlewares=edupilot-headers"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 900m
    cpus: 1.5

networks:
  proxy:
    external: true
