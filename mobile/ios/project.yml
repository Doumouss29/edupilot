name: EduPilot
options:
  bundleIdPrefix: ci.edupilot
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_CFBundleDisplayName: EduPilot
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
targets:
  EduPilot:
    type: application
    platform: iOS
    sources:
      - path: EduPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ci.edupilot.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "EduPilot pourra utiliser la caméra pour les fonctionnalités académiques qui en ont besoin."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "EduPilot peut joindre des documents et images aux activités scolaires."
