{% extends 'base.html' %}{% block heading %}Feuille de présence{% endblock %}{% block content %}<section class="panel"><h2>Appel facultatif — {{lesson.course_name}}</h2><p class="muted">Séance du {{lesson.starts_at}}</p><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><div class="table-scroll"><table><thead><tr><th>Matricule</th><th>Étudiant</th><th>Présence</th></tr></thead><tbody>{% for s in students %}<tr><td>{{s.matricule or '—'}}</td><td>{{s.name}}</td><td><select name="student_{{s.id}}"><option value="">Non renseigné</option>{% for val,label in [('present','Présent'),('absent','Absent'),('retard','En retard'),('excuse','Excusé')] %}<option value="{{val}}" {% if val==s.status %}selected{% endif %}>{{label}}</option>{% endfor %}</select></td></tr>{% endfor %}</tbody></table></div><button class="btn primary">Enregistrer l'appel</button></form></section>{% endblock %}
