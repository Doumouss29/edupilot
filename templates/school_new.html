{% extends 'base.html' %}{% block heading %}Créer un établissement{% endblock %}{% block content %}<div class="section-intro"><span class="eyebrow">NOUVEAU CLIENT</span><h2>Créer un établissement</h2><p>Après la création, vous pourrez ajouter les accès Admin et Administratif.</p></div><section class="panel form-page"><form action="{{url_for('school_new')}}" method="post" enctype="multipart/form-data" class="modern-form"><input type="hidden" name="csrf" value="{{csrf}}"><label>Nom de l'établissement<input name="name" required placeholder="Ex. Groupe Scolaire Excellence" maxlength="180"></label><label>Formule<select name="plan"><option>essentiel</option><option selected>standard</option><option>premium</option></select></label><label class="checkline"><input type="checkbox" name="campus_enabled" value="1"> Activer le module Campus (désactivé par défaut)</label><label>Fin de l'abonnement<input name="subscription_end" type="date" required></label><label>Logo (PNG, JPEG ou WEBP, 1 Mo max)<input name="logo" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="form-actions"><a class="btn outline" href="{{url_for('schools')}}">Annuler</a> <button class="btn primary">Créer et configurer les accès →</button></div></form></section>{% endblock %}
