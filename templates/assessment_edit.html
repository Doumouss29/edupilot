{% extends 'base.html' %}{% block heading %}Modifier l'évaluation{% endblock %}{% block content %}<div class="section-intro"><span class="eyebrow">ÉVALUATION</span><h2>Modifier {{item.title}}</h2><p>{{item.course_name}}</p></div><section class="panel form-page"><form method="post" class="modern-form"><input type="hidden" name="csrf" value="{{csrf}}"><label>Titre<input name="title" value="{{item.title}}" required maxlength="200"></label><label>Type<select name="kind">{% for k in ['Devoir','Contrôle continu','Examen','Projet'] %}<option {% if item.kind==k %}selected{% endif %}>{{k}}</option>{% endfor %}</select></label><label>Date limite<input name="due_date" type="date" value="{{item.due_date or ''}}"></label><label>Coefficient interne<input name="coefficient" type="number" step="0.1" min="0.1" max="100" value="{{item.coefficient}}" required></label><label class="full-row">Consignes<textarea name="description" rows="7">{{item.description or ''}}</textarea></label><div class="form-actions"><button class="btn primary">Enregistrer les modifications</button><a class="btn outline" href="{{url_for('assessments')}}">Annuler</a></div></form></section>{% endblock %}
