workflows:
  ios-prototype-check:
    name: EduPilot iOS - vérification de compilation
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Installer XcodeGen
        script: |
          brew install xcodegen
      - name: Générer le projet Xcode
        script: |
          cd mobile/ios
          xcodegen generate
      - name: Compiler pour simulateur iPhone (sans signature)
        script: |
          xcodebuild \
            -project mobile/ios/EduPilot.xcodeproj \
            -scheme EduPilot \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
